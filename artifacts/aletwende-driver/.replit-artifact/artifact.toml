kind = "mobile"
previewPath = "/"
title = "Aletwende Driver"
description = "A mobile driver app for the Aletwende ride and delivery platform. Drivers use it to register (uploading ID, license, and photos), log in, view and accept incoming trip and delivery requests, track active trips on a live map, and chat with passengers. Built with Expo Router, Firebase auth, real-time Firestore, and MapLibre."
version = "1.0.0"
id = "artifacts/aletwende-driver"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21798

[services.development]
run = "pnpm --filter @workspace/aletwende-driver run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aletwende-driver", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/aletwende-driver", "run", "serve" ]

[services.env]
PORT = "21798"
BASE_PATH = "/"
